[pytest]
asyncio_mode = auto
# importlib mode avoids ModuleNotFoundError when collecting web/tests/ (which
# has __init__.py files) alongside tests/ from the repo root. Pre-existing
# issue; the default prepend mode couldn't resolve web/tests as package "tests".
addopts = --import-mode=importlib
# Add web/ to sys.path so bare imports (import shared) and patch() targets
# like "skills.slack.mcp_client" resolve under importlib mode.
# Add . (project root) so `from web.routes...` imports in public/main tests resolve.
pythonpath = web .
