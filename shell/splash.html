<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>AI Gator</title>
<style>
  :root {
    --bg: #0a0f1a;
    --accent: #4ade80;
    --text: #dbeafe;
    --text-sub: #4a6a8a;
  }
  [data-theme="light"] {
    --bg: #f0f4f8;
    --accent: #16a34a;
    --text: #0f172a;
    --text-sub: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .splash {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
  }
  .gator {
    font-size: 3.5rem; line-height: 1;
    animation: chomp 0.8s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes chomp {
    0%, 100% { transform: translateY(0) scaleY(1); }
    30%      { transform: translateY(-4px) scaleY(0.85); }
    60%      { transform: translateY(0) scaleY(1.05); }
  }
  .title {
    font-size: 1.3rem; font-weight: 700;
    color: var(--accent); letter-spacing: .04em;
  }
  .status {
    font-size: .8rem; color: var(--text-sub);
    font-style: italic; min-height: 1.2em;
    transition: opacity .2s;
  }
  .bar-track {
    width: 200px; height: 3px;
    background: rgba(255,255,255,.08);
    border-radius: 2px; overflow: hidden;
  }
  [data-theme="light"] .bar-track { background: rgba(0,0,0,.08); }
  .bar-fill {
    height: 100%; width: 5%;
    background: var(--accent); border-radius: 2px;
    transition: width .4s ease;
  }
  .dots {
    display: flex; gap: 4px; margin-top: 2px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: .3;
    animation: dot-pulse 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-pulse {
    0%, 100% { opacity: .3; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="gator">&#x1F40A;</div>
    <div class="title">AI Gator</div>
    <div class="status" id="status">Starting up&hellip;</div>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
<script>
  (function () {
    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');
    let pct = 5;
    const tips = [
      'Starting up\u2026',
      'Warming up the swamp\u2026',
      'Stretching jaws\u2026',
      'Scanning the data lake\u2026',
      'Polishing scales\u2026',
      'Almost ready to chomp\u2026',
    ];
    let tipIdx = 0;
    setInterval(() => {
      tipIdx = (tipIdx + 1) % tips.length;
      pct = Math.min(90, pct + 12);
      statusEl.style.opacity = '0';
      setTimeout(() => {
        statusEl.textContent = tips[tipIdx];
        statusEl.style.opacity = '1';
        barEl.style.width = pct + '%';
      }, 200);
    }, 1500);
  })();
</script>
</body>
</html>
