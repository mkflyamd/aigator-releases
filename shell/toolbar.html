<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; connect-src https://fonts.gstatic.com; script-src 'unsafe-inline';"
    />
    <title>AI Gator Toolbar</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0"
    />
    <style>
      :root {
        --bg: #0a0f1a;
        --surface: #111827;
        --surface2: #1a2332;
        --border: #1e3a52;
        --border2: #2a4a6b;
        --accent: #4ade80;
        --text: #dbeafe;
        --text-dim: #6b8db5;
        --text-sub: #4a6a8a;
        --tb-bg: rgba(10, 15, 26, 0.85);
        --accent-rgb: 74, 222, 128;
        --hover-bg: rgba(255, 255, 255, 0.05);
        --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --tb-h: 40px;
      }
      /* Light mode — values match web/static/style.css [data-theme="light"] block */
      [data-theme='light'] {
        --bg: #f0f4f8;
        --surface: #ffffff;
        --surface2: #e8eef5;
        --border: #cbd5e1;
        --border2: #94a3b8;
        --accent: #16a34a;
        --text: #0f172a;
        --text-dim: #475569;
        --text-sub: #64748b;
        --tb-bg: rgba(240, 244, 248, 0.92);
        --accent-rgb: 22, 163, 74;
        --hover-bg: rgba(0, 0, 0, 0.06);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
        font-size: 12px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .tb {
        display: flex;
        align-items: center;
        gap: 2px;
        height: var(--tb-h);
        padding: 0 6px 0 4px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        position: relative;
        /* Make the toolbar draggable to move the window (Windows/Linux). macOS
       uses native traffic-light buttons, so the drag region is harmless. */
        -webkit-app-region: drag;
      }
      /* Interactive elements inside the draggable bar must opt out of drag,
     otherwise clicks are swallowed by the window-move gesture. */
      .tb-btn,
      .tb-overflow,
      .tb-url,
      .tb-star,
      .tb-bubble,
      .tb-menu,
      .tb-collapse-btn {
        -webkit-app-region: no-drag;
      }

      /* Drag spacer: grab zone between window controls and nav buttons. The
     whole bar is already draggable; this guarantees a minimum empty zone
     to grab even when the URL bar fills the width. */
      .tb-drag-spacer {
        flex: 0 0 48px;
        height: 100%;
      }
      /* Right drag spacer: small grab zone on the right edge. Fixed width so
     it doesn't compete with the URL bar for leftover space. */
      .tb-drag-spacer-right {
        flex: 0 0 8px;
        height: 100%;
      }
      .tb-btn {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        background: none;
        border: none;
        border-radius: 5px;
        color: var(--text-dim);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
      }
      .tb-btn:hover:not(:disabled) {
        background: var(--hover-bg);
        color: var(--text);
      }
      .tb-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .tb-btn svg {
        width: 13px;
        height: 13px;
      }
      .tb-btn.is-spinning svg {
        animation: tb-spin 0.7s linear infinite;
      }
      @keyframes tb-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .tb-sep {
        width: 1px;
        height: 14px;
        background: var(--border2);
        margin: 0 4px;
        flex-shrink: 0;
        opacity: 0.6;
      }

      .tb-lock {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        color: var(--text-sub);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 4px;
      }
      .tb-lock svg {
        width: 11px;
        height: 11px;
      }

      .tb-url {
        width: 100%;
        min-width: 120px;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        gap: 4px;
        height: 28px;
        padding: 0 4px 0 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-dim);
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: text;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .tb-url:hover {
        border-color: var(--border2);
        color: var(--text);
      }
      .tb-url.is-loading {
        color: var(--text-sub);
      }
      .tb-url.is-error {
        border-color: var(--danger, #e5484d);
      }
      .tb-url-text {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      .tb-url-input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 11px;
        font-family: inherit;
        line-height: 1;
        padding: 0;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        user-select: text;
        -webkit-user-select: text;
      }
      .tb-url-input::selection {
        background: var(--accent);
        color: var(--bg);
      }
      .tb-url-input[readonly] {
        cursor: default;
      }
      .tb-url-input:not([readonly]) {
        cursor: text;
      }
      .tb-url-host {
        color: var(--text);
        font-weight: 500;
      }
      .tb-url-path {
        color: var(--text-dim);
      }
      .tb-star {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        background: none;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-sub);
        transition: var(--transition);
      }
      .tb-star[hidden] {
        display: none;
      }
      .tb-star:hover {
        color: var(--text);
        background: var(--hover-bg);
      }
      .tb-star:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 1px;
      }
      .tb-star .tb-star-path {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linejoin: round;
      }
      .tb-star.is-filled {
        color: var(--accent);
      }
      .tb-star.is-filled .tb-star-path {
        fill: currentColor;
      }

      .tb-bubble {
        position: absolute;
        top: calc(var(--tb-h) + 4px);
        right: 8px;
        width: 260px;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        z-index: 60;
      }
      .tb-bubble[hidden] {
        display: none;
      }
      .tb-bubble-label {
        display: block;
        margin-bottom: 4px;
        color: var(--text-dim);
        font-size: 11px;
      }
      .tb-bubble-name {
        width: 100%;
        height: 28px;
        padding: 0 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        user-select: text;
      }
      .tb-bubble-name:focus {
        outline: none;
        border-color: var(--accent);
      }
      .tb-bubble-note {
        margin: 8px 0 12px;
        color: var(--text-dim);
        font-size: 11px;
        line-height: 1.4;
      }
      .tb-bubble-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tb-bubble-remove,
      .tb-bubble-done {
        height: 26px;
        padding: 0 12px;
        border-radius: 6px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }
      .tb-bubble-remove {
        background: none;
        border: 1px solid transparent;
        color: #ef4444;
      }
      .tb-bubble-remove:hover {
        background: rgba(239, 68, 68, 0.12);
      }
      .tb-bubble-done {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #0a0f1a;
      }
      .tb-bubble-done:hover {
        filter: brightness(1.08);
      }
      .tb-bubble-remove:focus-visible,
      .tb-bubble-done:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }

      .tb-collapse-btn {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px;
        margin-left: 4px;
        cursor: pointer;
        transition: var(--transition);
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tb-collapse-btn .material-symbols-outlined {
        font-size: 18px;
        line-height: 1;
        font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24;
      }
      .tb-collapse-btn:hover {
        color: var(--text);
        background: var(--surface2);
        border-color: var(--border2);
      }

      .tb-overflow {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        background: none;
        border: none;
        border-radius: 4px;
        color: var(--text-sub);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        margin-left: 2px;
      }
      .tb-overflow:hover {
        background: var(--hover-bg);
        color: var(--text);
      }
      .tb-overflow svg {
        width: 13px;
        height: 13px;
      }

      /* ── Window controls (Windows/Linux only) ─────────────────────────── */
      /* macOS uses native traffic-light buttons, so these are not rendered. */
      .tb-wincontrols {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        margin-left: 4px;
        -webkit-app-region: no-drag;
      }
      .tb-win-btn {
        width: 26px;
        height: 26px;
        background: none;
        border: none;
        border-radius: 7px;
        color: var(--text-dim);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        flex-shrink: 0;
      }
      .tb-win-btn:hover {
        background: var(--hover-bg);
        color: var(--text);
      }
      .tb-win-btn svg {
        width: 11px;
        height: 11px;
      }
      .tb-win-btn.tb-win-close:hover {
        background: #e81123;
        color: #fff;
      }

      .tb-menu {
        position: absolute;
        top: var(--tb-h);
        right: 4px;
        min-width: 180px;
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 8px;
        padding: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        z-index: 50;
        display: none;
      }
      .tb-menu.is-open {
        display: block;
      }
      .tb-menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 5px;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
      }
      .tb-menu-item:hover {
        background: var(--surface2);
      }
      .tb-menu-item svg {
        width: 13px;
        height: 13px;
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .tb-menu-sep {
        height: 1px;
        background: var(--border);
        margin: 4px 0;
      }
      .tb-menu-hint {
        font-size: 10px;
        color: var(--text-sub);
        margin-left: auto;
      }

      /* Web pane pins: shown only while a custom app is the active pane. */
      .tb-pin-group {
        display: none;
        align-items: center;
        gap: 2px;
        margin-left: 4px;
        -webkit-app-region: no-drag;
      }
      .tb.is-pinnable .tb-pin-group {
        display: flex;
      }
      .tb-pin-emoji {
        font-size: 14px;
        line-height: 1;
      }
      .tb-btn.is-active {
        color: var(--accent);
        background: rgba(var(--accent-rgb), 0.14);
      }
      .tb-pin-live {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .tb-pinbar {
        display: none;
        flex: 1 1 auto;
        min-width: 120px;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 4px 0 10px;
        border: 1px solid rgba(var(--accent-rgb), 0.5);
        border-radius: 6px;
        background: rgba(var(--accent-rgb), 0.12);
        color: var(--text);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }
      .tb.is-pinning .tb-url {
        display: none;
      }
      .tb.is-pinning .tb-pinbar {
        display: flex;
      }
      .tb-pinbar-label {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--accent);
      }
      .tb-pinbar:not(.has-kind) .tb-pinbar-label,
      .tb-pinbar-kind {
        margin-right: auto;
      }
      .tb-pinbar-kind {
        display: none;
        flex: 0 0 auto;
        margin-left: -3px;
        color: var(--text-dim);
      }
      .tb-pinbar.has-kind .tb-pinbar-kind {
        display: block;
      }
      .tb-pinbar-kind::before {
        content: '\00b7\00a0';
      }
      [data-theme='light'] .tb-pinbar-label {
        color: #15803d;
      }
      .tb-pinbar > svg,
      .tb-pinbar kbd,
      .tb-pinbar .tb-btn {
        flex: 0 0 auto;
      }
      .tb-pinbar.has-label .tb-pinbar-prompt,
      .tb-pinbar.has-label .tb-pinbar-prompt-short,
      .tb-pinbar.has-label .tb-pinbar-hint {
        display: none;
      }
      .tb-pinbar-prompt-short {
        display: none;
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tb-pinbar-prompt,
      .tb-pinbar-hint {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 520px) {
        .tb-pinbar-hint {
          display: none;
        }
      }
      @media (max-width: 480px) {
        .tb-pinbar.has-kind .tb-pinbar-kind {
          display: none;
        }
        .tb-pinbar.has-kind .tb-pinbar-label {
          margin-right: auto;
        }
      }
      @media (max-width: 400px) {
        .tb-pinbar kbd,
        .tb-pinbar-prompt {
          display: none;
        }
        .tb-pinbar:not(.has-label) .tb-pinbar-prompt-short {
          display: block;
        }
        .tb-pinbar {
          min-width: 142px;
        }
      }
      .tb-pinbar kbd {
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        color: var(--text-dim);
        font: inherit;
        font-size: 10px;
      }

      /* Hidden state — toolbar view is set invisible from main process, but keep
     a class for completeness. */
      .tb.is-hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="tb" id="tb">
      <div class="tb-wincontrols" id="tb-wincontrols"></div>
      <!-- Drag spacer: grab zone between window controls and nav buttons.
         Double-click toggles maximize (standard OS title-bar convention). -->
      <div class="tb-drag-spacer"></div>
      <button class="tb-btn" id="tb-back" title="Back (Alt+Left)" disabled>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <button class="tb-btn" id="tb-forward" title="Forward (Alt+Right)" disabled>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
      <button class="tb-btn" id="tb-reload" title="Reload">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
      </button>

      <div class="tb-url" id="tb-url" title="">
        <div class="tb-lock" id="tb-lock" title="Secure">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <input
          class="tb-url-input"
          id="tb-url-input"
          type="text"
          value="—"
          readonly="readonly"
          spellcheck="false"
        />
        <span class="tb-url-text" id="tb-url-text" style="display: none">—</span>
        <button
          class="tb-star"
          id="tb-star"
          type="button"
          aria-label="Add this site to your web apps"
          aria-pressed="false"
          title="Add this site to your web apps"
          hidden
        >
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              class="tb-star-path"
              d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8-4.3-4.1 5.9-.9z"
            />
          </svg>
        </button>
        <button class="tb-overflow" id="tb-overflow" title="More actions">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="5" r="1" />
            <circle cx="12" cy="12" r="1" />
            <circle cx="12" cy="19" r="1" />
          </svg>
        </button>
      </div>

      <div class="tb-pin-live" id="tb-pin-live" role="status" aria-live="polite"></div>
      <div class="tb-pinbar" id="tb-pinbar" role="status">
        <svg
          viewBox="0 0 24 24"
          width="13"
          height="13"
          fill="none"
          stroke="var(--accent)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="8" />
          <line x1="12" y1="2" x2="12" y2="6" />
          <line x1="12" y1="18" x2="12" y2="22" />
          <line x1="2" y1="12" x2="6" y2="12" />
          <line x1="18" y1="12" x2="22" y2="12" />
        </svg>
        <span class="tb-pinbar-prompt">Click or press Tab to choose what to pin</span
        ><span class="tb-pinbar-prompt-short">Click to pin</span>
        <span class="tb-pinbar-label" id="tb-pinbar-label" aria-live="off"></span
        ><span class="tb-pinbar-kind" id="tb-pinbar-kind" aria-live="off"></span> <kbd>Esc</kbd
        ><span class="tb-pinbar-hint" style="color: var(--text-dim)">to cancel</span>
        <button
          class="tb-btn"
          id="tb-pinbar-cancel"
          title="Cancel pinning"
          aria-label="Cancel pinning"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <line x1="6" y1="6" x2="18" y2="18" />
            <line x1="18" y1="6" x2="6" y2="18" />
          </svg>
        </button>
      </div>

      <div class="tb-pin-group" id="tb-pin-group">
        <button
          class="tb-btn"
          id="tb-pin"
          title="Pin an element to Gator"
          aria-label="Pin an element to Gator"
        >
          <span class="tb-pin-emoji" aria-hidden="true">&#x1F4CC;</span>
        </button>
        <button
          class="tb-btn"
          id="tb-pin-view"
          title="Pin this view to Gator"
          aria-label="Pin this view to Gator"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
            />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
        </button>
      </div>

      <button class="tb-btn tb-collapse-btn" id="tb-collapse" title="Collapse Gator">
        <span class="material-symbols-outlined">left_panel_open</span>
      </button>

      <!-- Right drag spacer: fills remaining space so the user can grab the
         right side to move the window. -->
      <div class="tb-drag-spacer-right"></div>
    </div>

    <div class="tb-bubble" id="tb-bubble" role="dialog" aria-label="Web app" hidden>
      <label class="tb-bubble-label" for="tb-bubble-name">Name</label>
      <input
        class="tb-bubble-name"
        id="tb-bubble-name"
        type="text"
        maxlength="40"
        spellcheck="false"
      />
      <div class="tb-bubble-note" id="tb-bubble-note">
        Removing deletes any pins, settings and saved sign-in.
      </div>
      <div class="tb-bubble-actions">
        <button type="button" class="tb-bubble-remove" id="tb-bubble-remove">Remove</button>
        <button type="button" class="tb-bubble-done" id="tb-bubble-done">Done</button>
      </div>
    </div>

    <div class="tb-menu" id="tb-menu">
      <div class="tb-menu-item" id="tb-menu-reload">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
        <span>Reload</span>
        <span class="tb-menu-hint">Ctrl+R</span>
      </div>
      <div class="tb-menu-item" id="tb-menu-hard-reload">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
        <span>Hard reload</span>
        <span class="tb-menu-hint">Ctrl+Shift+R</span>
      </div>
      <div class="tb-menu-item" id="tb-menu-copy-url">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span>Copy URL</span>
      </div>
      <div class="tb-menu-sep"></div>
      <div class="tb-menu-item" id="tb-menu-open-browser">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
        <span>Open in browser</span>
      </div>
    </div>

    <script>
      (function () {
        const tb = window.gatorToolbar;
        // Convenience aliases matching the ipcRenderer shape the rest of this
        // script expects. tb.on/send/invoke are exposed by toolbar-preload.js.
        // NOTE: tb.on already strips the Electron event arg (preload wrapper), so
        // ipcRenderer.on callbacks receive only the payload (no _e first arg).
        const ipcRenderer = {
          send: (...a) => tb.send(...a),
          on: (ch, cb) => tb.on(ch, cb),
          invoke: (...a) => tb.invoke(...a),
        };

        const elBack = document.getElementById('tb-back');
        const elFwd = document.getElementById('tb-forward');
        const elReload = document.getElementById('tb-reload');
        const elUrl = document.getElementById('tb-url');
        const elUrlInput = document.getElementById('tb-url-input');
        const elUrlText = document.getElementById('tb-url-text');
        const elStar = document.getElementById('tb-star');
        const elBubble = document.getElementById('tb-bubble');
        const elBubbleName = document.getElementById('tb-bubble-name');
        const elBubbleNote = document.getElementById('tb-bubble-note');
        const elOverflow = document.getElementById('tb-overflow');
        const elMenu = document.getElementById('tb-menu');
        const elCollapse = document.getElementById('tb-collapse');

        let currentUrl = '';
        let currentApp = null;
        let isLoading = false;
        let spinTimer = null;
        let star = { state: 'hidden', appId: null, name: '' };
        let userEditing = false;
        // Text the user just submitted; stays in the field until the page's real URL arrives.
        let submittedText = null;
        let submittedFrom = '';
        let submitTimer = null;
        let errorTimer = null;

        // True when the user has an active text selection inside the URL field.
        function urlTextSelected() {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed || sel.rangeCount === 0) return false;
          const node = sel.anchorNode;
          return node && (elUrlText.contains(node) || elUrlInput.contains(node));
        }

        function setSpinning(on) {
          if (on) {
            elReload.classList.add('is-spinning');
            elReload.disabled = true;
          } else {
            elReload.classList.remove('is-spinning');
            elReload.disabled = false;
          }
        }

        // Brief spin animation on reload click for feedback even when the page
        // doesn't fire did-start-loading (e.g. some SPAs).
        function pulseSpin() {
          setSpinning(true);
          clearTimeout(spinTimer);
          spinTimer = setTimeout(() => setSpinning(false), 1200);
        }

        function renderUrl(url) {
          // Navigation/state events arrive while a user is typing.  The old
          // code updated the input and restored readonly on every event,
          // making the address bar appear read-only in practice.  Preserve
          // the edit buffer until Enter or Escape/blur completes the edit.
          currentUrl = url || '';
          // The 500ms state poll keeps re-sending the old URL until the new page commits.
          if (submittedText !== null && currentUrl === submittedFrom) return;
          submittedText = null;
          if (userEditing) return;
          if (urlTextSelected()) return;
          if (!currentUrl) {
            elUrlInput.value = '—';
            elUrlInput.setAttribute('readonly', 'readonly');
            elUrl.title = '';
            return;
          }
          elUrlInput.value = currentUrl;
          elUrlInput.setAttribute('readonly', 'readonly');
          elUrl.title = currentUrl;
        }

        function renderApp(app) {
          currentApp = app;
          elReload.title = app
            ? 'Reload ' + (app === 'email' ? 'outlook' : app)
            : 'Refresh Gator data';
        }

        function renderNavState(state) {
          elBack.disabled = !state.canGoBack;
          elFwd.disabled = !state.canGoForward;
        }

        function setLoading(on) {
          isLoading = on;
          elUrl.classList.toggle('is-loading', on);
          if (on) setSpinning(true);
          else setSpinning(false);
        }

        // ── Writable address bar ──────────────────────────────────────────────
        elUrlInput.addEventListener('focus', () => {
          if (!userEditing && currentUrl) {
            elUrlInput.removeAttribute('readonly');
            userEditing = true;
            // Defer select() to the next tick: the native mouseup that
            // follows this focus (when focus was triggered by a click)
            // would otherwise collapse our selection to a caret at the
            // click point right after we set it.
            setTimeout(() => elUrlInput.select(), 0);
          }
        });

        elUrlInput.addEventListener('blur', () => {
          userEditing = false;
          elUrlInput.setAttribute('readonly', 'readonly');
          if (submittedText === null) renderUrl(currentUrl);
        });

        function showNavigationError(message) {
          submittedText = null;
          renderUrl(currentUrl);
          setSpinning(false);
          elUrl.classList.add('is-error');
          elUrl.title = message || 'Could not open that address';
          clearTimeout(errorTimer);
          errorTimer = setTimeout(() => {
            elUrl.classList.remove('is-error');
            elUrl.title = currentUrl;
          }, 4000);
        }

        elUrlInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const typed = elUrlInput.value.trim();
            if (!typed) {
              elUrlInput.blur();
              return;
            }
            elUrl.classList.remove('is-error');
            submittedText = typed;
            submittedFrom = currentUrl;
            clearTimeout(submitTimer);
            submitTimer = setTimeout(() => {
              submittedText = null;
              renderUrl(currentUrl);
            }, 10000);
            pulseSpin();
            // main decides between an address and a web search, and hands focus to the page.
            ipcRenderer.send('toolbar:navigate', typed);
            elUrlInput.blur();
          } else if (e.key === 'Escape') {
            // First Escape restores the current address, a second one leaves the field.
            if (elUrlInput.value !== currentUrl) {
              elUrlInput.value = currentUrl;
              elUrlInput.select();
            } else {
              elUrlInput.blur();
            }
          }
        });

        // Click on the read-only input selects all text for easy copy.
        elUrlInput.addEventListener('click', () => {
          if (elUrlInput.hasAttribute('readonly') && currentUrl) {
            elUrlInput.select();
          }
        });

        ipcRenderer.on('toolbar:focus-url', () => {
          if (currentUrl) elUrlInput.focus();
        });
        ipcRenderer.on('toolbar:navigation-error', (info) => {
          showNavigationError(info && info.message);
        });

        // ── Favorite star + edit bubble ──────────────────────────────────────
        const BUBBLE_EXPANDED_H = 170;
        const MENU_EXPANDED_H = 150;

        function renderStar(next) {
          if (star.appId !== next.appId) closeBubble();
          star = next;
          const filled = star.state === 'filled';
          elStar.hidden = star.state === 'hidden';
          elStar.classList.toggle('is-filled', filled);
          elStar.setAttribute('aria-pressed', filled ? 'true' : 'false');
          const label = filled
            ? 'Saved in your web apps · click to remove · right-click to rename'
            : 'Add this site to your web apps';
          elStar.setAttribute('aria-label', label);
          elStar.title = label;
          if (star.state === 'hidden') closeBubble();
        }

        function bubbleOpen() {
          return !elBubble.hidden;
        }

        function openBubble(knownNote) {
          closeMenu();
          elBubbleName.value = star.name || '';
          elBubbleNote.textContent =
            knownNote || 'Removing deletes any pins, settings and saved sign-in.';
          elBubble.hidden = false;
          ipcRenderer.send('toolbar:set-expanded', BUBBLE_EXPANDED_H);
          elBubbleName.focus();
          elBubbleName.select();
          if (knownNote) return;
          const forApp = star.appId;
          ipcRenderer
            .invoke('toolbar:star-removal-note', forApp)
            .then((info) => {
              if (bubbleOpen() && star.appId === forApp && info && typeof info.note === 'string') {
                elBubbleNote.textContent = info.note;
              }
            })
            .catch(() => {});
        }

        // A star with no pins behind it removes straight away (Undo toast); with pins, the
        // bubble names what will be deleted first. An unknown count is treated as "has pins".
        async function onFilledStarClick() {
          const appId = star.appId;
          if (!appId) return;
          if (bubbleOpen()) {
            finishBubble();
            return;
          }
          let info = null;
          try {
            info = await ipcRenderer.invoke('toolbar:star-removal-note', appId);
          } catch {}
          if (star.appId !== appId || star.state !== 'filled') return;
          if (info && info.count === 0) {
            closeBubble();
            ipcRenderer.send('toolbar:star-remove', appId);
          } else if (!bubbleOpen()) {
            openBubble(info && info.note);
          }
        }

        ipcRenderer.on('toolbar:open-bubble', (appId) => {
          if (star.state === 'filled' && star.appId === appId && !bubbleOpen()) openBubble();
        });

        function closeBubble() {
          if (!bubbleOpen()) return;
          elBubble.hidden = true;
          ipcRenderer.send('toolbar:set-expanded', 0);
        }

        function finishBubble() {
          const name = elBubbleName.value.trim();
          if (star.appId && name && name !== star.name) {
            ipcRenderer.send('toolbar:star-rename', star.appId, name);
          }
          closeBubble();
        }

        elStar.addEventListener('click', (e) => {
          e.stopPropagation();
          if (star.state === 'filled') {
            onFilledStarClick();
          } else if (star.state === 'empty') {
            ipcRenderer.send('toolbar:star-add');
          }
        });
        elStar.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (star.state !== 'filled') return;
          if (bubbleOpen()) finishBubble();
          else openBubble();
        });
        elBubble.addEventListener('click', (e) => e.stopPropagation());
        elBubbleName.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            finishBubble();
          }
        });
        document.getElementById('tb-bubble-done').addEventListener('click', finishBubble);
        document.getElementById('tb-bubble-remove').addEventListener('click', () => {
          const appId = star.appId;
          closeBubble();
          if (appId) ipcRenderer.send('toolbar:star-remove', appId);
        });
        document.addEventListener('click', () => {
          if (bubbleOpen()) finishBubble();
        });
        window.addEventListener('blur', () => {
          if (bubbleOpen()) finishBubble();
        });

        // ── Button handlers ──────────────────────────────────────────────────
        elBack.addEventListener('click', () => {
          pulseSpin();
          ipcRenderer.send('toolbar:back');
        });
        elFwd.addEventListener('click', () => {
          pulseSpin();
          ipcRenderer.send('toolbar:forward');
        });
        elReload.addEventListener('click', () => {
          pulseSpin();
          ipcRenderer.send('toolbar:reload');
        });
        elCollapse.addEventListener('click', () => {
          ipcRenderer.send('toolbar:collapse-gator');
        });

        // ── Overflow menu ─────────────────────────────────────────────────────
        function closeMenu() {
          if (!elMenu.classList.contains('is-open')) return;
          elMenu.classList.remove('is-open');
          ipcRenderer.send('toolbar:set-expanded', 0);
        }

        function toggleMenu() {
          if (elMenu.classList.contains('is-open')) {
            closeMenu();
            return;
          }
          closeBubble();
          elMenu.classList.add('is-open');
          ipcRenderer.send('toolbar:set-expanded', MENU_EXPANDED_H);
        }

        elOverflow.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMenu();
        });
        document.addEventListener('click', closeMenu);
        document.addEventListener('contextmenu', (e) => {
          // Allow right-click anywhere to open the menu too (browser-like), but
          // not on the buttons themselves (let them handle their own context).
          if (e.target.closest('.tb-btn') || e.target.closest('.tb-overflow')) return;
          e.preventDefault();
          toggleMenu();
        });

        document.getElementById('tb-menu-reload').addEventListener('click', () => {
          closeMenu();
          pulseSpin();
          ipcRenderer.send('toolbar:reload');
        });
        document.getElementById('tb-menu-hard-reload').addEventListener('click', () => {
          closeMenu();
          pulseSpin();
          ipcRenderer.send('toolbar:hard-reload');
        });
        document.getElementById('tb-menu-copy-url').addEventListener('click', async () => {
          closeMenu();
          if (currentUrl) {
            try {
              await navigator.clipboard.writeText(currentUrl);
            } catch {}
          }
        });
        document.getElementById('tb-menu-open-browser').addEventListener('click', () => {
          closeMenu();
          if (currentUrl) ipcRenderer.send('toolbar:open-in-browser', currentUrl);
        });

        // Right-click on reload = hard reload (browser convention)
        elReload.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          pulseSpin();
          ipcRenderer.send('toolbar:hard-reload');
        });

        // ── Web pane pins ─────────────────────────────────────────────────────
        const elBar = document.getElementById('tb');
        const elPin = document.getElementById('tb-pin');
        const elPinLabel = document.getElementById('tb-pinbar-label');
        const elPinKind = document.getElementById('tb-pinbar-kind');
        const elPinBar = document.getElementById('tb-pinbar');
        elPin.addEventListener('click', () => ipcRenderer.send('toolbar:web-pin-start'));
        document
          .getElementById('tb-pin-view')
          .addEventListener('click', () => ipcRenderer.send('toolbar:web-pin-view'));
        document
          .getElementById('tb-pinbar-cancel')
          .addEventListener('click', () => ipcRenderer.send('toolbar:web-pin-cancel'));
        const PIN_KEYS = new Set(['Tab', 'ArrowUp', 'ArrowDown', 'Enter']);
        const elPinLive = document.getElementById('tb-pin-live');
        let pinLiveTimer = null;
        // Clear first so the same sentence twice in a row is announced again.
        function announcePin(text) {
          elPinLive.textContent = '';
          clearTimeout(pinLiveTimer);
          pinLiveTimer = setTimeout(() => {
            elPinLive.textContent = text;
          }, 60);
        }
        function renderPin(state) {
          if (typeof state.pinnable === 'boolean')
            elBar.classList.toggle('is-pinnable', state.pinnable);
          if (typeof state.pinAnnounce === 'string' && state.pinAnnounce)
            announcePin(state.pinAnnounce);
          if (typeof state.pinMode === 'boolean') {
            const wasPinning = elBar.classList.contains('is-pinning');
            elBar.classList.toggle('is-pinning', state.pinMode);
            elPin.classList.toggle('is-active', state.pinMode);
            // The banner (and its Cancel button) hides when picking ends; keep keyboard focus on the Pin button.
            if (wasPinning && !state.pinMode && document.hasFocus()) elPin.focus();
          }
          if (typeof state.pinLabel === 'string') {
            elPinLabel.textContent = state.pinLabel;
            elPinBar.classList.toggle('has-label', state.pinLabel.length > 0);
            const kind = state.pinLabel && typeof state.pinKind === 'string' ? state.pinKind : '';
            elPinKind.textContent = kind;
            elPinBar.classList.toggle('has-kind', kind.length > 0);
          }
        }

        // ── Keyboard shortcuts ────────────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
          const meta = e.ctrlKey || e.metaKey;
          if (meta && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            pulseSpin();
            ipcRenderer.send(e.shiftKey ? 'toolbar:hard-reload' : 'toolbar:reload');
          } else if (e.altKey && e.key === 'ArrowLeft') {
            e.preventDefault();
            pulseSpin();
            ipcRenderer.send('toolbar:back');
          } else if (e.altKey && e.key === 'ArrowRight') {
            e.preventDefault();
            pulseSpin();
            ipcRenderer.send('toolbar:forward');
          } else if (e.key === 'Escape' && bubbleOpen()) {
            closeBubble();
          } else if (e.key === 'Escape' && elMenu.classList.contains('is-open')) {
            closeMenu();
          } else if (e.key === 'Escape' && elBar.classList.contains('is-pinning')) {
            ipcRenderer.send('toolbar:web-pin-cancel');
          } else if (
            elBar.classList.contains('is-pinning') &&
            PIN_KEYS.has(e.key) &&
            !(e.key === 'Enter' && e.target && e.target.id === 'tb-pinbar-cancel')
          ) {
            e.preventDefault();
            ipcRenderer.send('toolbar:web-pin-key', {
              key: e.key,
              shift: e.shiftKey,
              control: e.ctrlKey,
              alt: e.altKey,
              meta: e.metaKey,
            });
          }
        });

        // ── IPC from main process ─────────────────────────────────────────────
        // NOTE: tb.on (via ipcRenderer.on) strips the Electron event arg, so the
        // callback receives only the state payload.
        ipcRenderer.on('toolbar:state', (state) => {
          if (!state) return;
          renderPin(state);
          if (typeof state.url === 'string') renderUrl(state.url);
          if (typeof state.app === 'string' || state.app === null) renderApp(state.app);
          if (state.star) renderStar(state.star);
          if (state.nav) renderNavState(state.nav);
          if (typeof state.loading === 'boolean') setLoading(state.loading);
          if (typeof state.visible === 'boolean') {
            document.body.style.display = state.visible ? '' : 'none';
          }
          if (typeof state.maximized === 'boolean') renderMaximize(state.maximized);
          if (typeof state.gatorSqueezed === 'boolean') renderCollapse(state.gatorSqueezed);
        });

        // ── Window controls (Windows/Linux only) ──────────────────────────────
        // macOS uses native traffic-light buttons — don't render custom controls.
        const elWinControls = document.getElementById('tb-wincontrols');
        const isMac = tb.platform === 'darwin';
        let isMaximized = false;

        function renderMaximize(maximized) {
          isMaximized = maximized;
          const btn = document.getElementById('tb-win-max');
          if (!btn) return;
          // Restore icon (two overlapping squares — front square with top-right
          // notch, back square behind) when maximized, single square when not.
          btn.innerHTML = maximized
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="1"/><path d="M8 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>';
          btn.title = maximized ? 'Restore' : 'Maximize';
        }

        function renderCollapse(squeezed) {
          const btn = document.getElementById('tb-collapse');
          if (!btn) return;
          const icon = btn.querySelector('.material-symbols-outlined');
          if (icon) {
            // left_panel_open: Gator visible, click to collapse.
            // left_panel_close: Gator collapsed, click to expand.
            icon.textContent = squeezed ? 'left_panel_close' : 'left_panel_open';
          }
          btn.title = squeezed ? 'Open Gator' : 'Collapse Gator';
        }

        if (!isMac && elWinControls) {
          elWinControls.innerHTML =
            '<button class="tb-win-btn tb-win-close" id="tb-win-close" title="Close">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>' +
            '</button>' +
            '<button class="tb-win-btn" id="tb-win-max" title="Maximize">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>' +
            '</button>' +
            '<button class="tb-win-btn" id="tb-win-min" title="Minimize">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            '</button>';

          // Window controls send GENERIC events. main.js routes by sender id so the
          // same button handler works on the main window AND child windows — no
          // per-instance channel wiring needed (and no mutation of the frozen
          // contextBridge object, which silently no-ops).
          document
            .getElementById('tb-win-min')
            .addEventListener('click', () => ipcRenderer.send('toolbar:minimize'));
          document
            .getElementById('tb-win-max')
            .addEventListener('click', () => ipcRenderer.send('toolbar:maximize-toggle'));
          document
            .getElementById('tb-win-close')
            .addEventListener('click', () => ipcRenderer.send('toolbar:close'));

          // Maximize icon state is driven entirely by 'toolbar:state' pushes from
          // main.js (button click, OS Aero Snap, Win+Up, drag-double-click) — see
          // the 'toolbar:state' listener above. No initial poll needed: main pushes
          // { maximized } on toolbar:ready and on every maximize/unmaximize event.
        }

        // Double-click on the drag spacer toggles maximize — standard OS title-bar
        // convention. The whole bar is draggable, but the spacer is the designated
        // double-click target.
        const dragSpacer = document.querySelector('.tb-drag-spacer');
        if (dragSpacer) {
          dragSpacer.addEventListener('dblclick', () =>
            ipcRenderer.send('toolbar:maximize-toggle'),
          );
        }

        // ── Theme (light/dark) ────────────────────────────────────────────────
        // main.js forwards the effective theme ('light' or 'dark') from the Gator
        // renderer's ThemeManager. Set data-theme on <html> so the [data-theme]
        // CSS overrides take effect.
        ipcRenderer.on('toolbar:theme', (theme) => {
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        });

        // Initial pull — main process will push the full state right after load.
        ipcRenderer.send('toolbar:ready');
      })();
    </script>
  </body>
</html>
