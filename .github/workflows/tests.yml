name: Tests

env:
  UV_MALWARE_CHECK: '1'
  UV_PREVIEW_FEATURES: malware-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests and coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run coverage run --source=web,packaging --omit='*/tests/*' -m pytest tests -q

      - name: Create coverage reports
        run: |
          uv run coverage report --show-missing
          uv run coverage xml -o coverage.xml
          uv run coverage html -d htmlcov

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  os-sandbox:
    name: Real OS sandbox and vault (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AIGATOR_REAL_VAULT: '1'
      SANDBOX_TESTS: >-
        tests/test_secure_store_real_vault.py tests/code_sandbox tests/shell_runner
        tests/marketplace/test_tool_sandbox.py tests/hooks/test_hooks_sandboxed.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Linux - install bubblewrap and a keyring, allow user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gnome-keyring dbus-user-session
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / -- true

      - name: macOS - create an unlocked keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p aigator-fake-api-key aigator-ci.keychain
          security list-keychains -d user -s aigator-ci.keychain
          security default-keychain -s aigator-ci.keychain
          security unlock-keychain -p aigator-fake-api-key aigator-ci.keychain
          security set-keychain-settings aigator-ci.keychain

      - name: Run sandbox and vault tests (a skip is a failure)
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            runner='dbus-run-session -- bash -c'
            prefix='echo -n aigator-fake-api-key | gnome-keyring-daemon --unlock --components=secrets >/dev/null;'
          else
            runner='bash -c'
            prefix=''
          fi
          $runner "$prefix uv run pytest $SANDBOX_TESTS -q -rs -o faulthandler_timeout=120" 2>&1 | tee sandbox-tests.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "^SKIPPED .*(OS sandbox is not (enforced|available)|bubblewrap is not installed|AIGATOR_REAL_VAULT)" sandbox-tests.log; then
            echo "A sandbox or vault test was skipped; the platform check did not run." >&2
            exit 1
          fi

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run JavaScript tests
        run: npm --prefix shell test
