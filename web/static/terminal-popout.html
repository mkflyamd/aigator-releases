<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Gator terminal</title>
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        overflow: hidden;
      }
      #term {
        position: absolute;
        inset: 6px;
      }
      #status {
        position: absolute;
        right: 10px;
        bottom: 8px;
        font:
          12px system-ui,
          sans-serif;
        color: #fbbf24;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="term"></div>
    <div id="status"></div>
    <script src="/static/vendor/xterm/xterm.js"></script>
    <script src="/static/vendor/xterm/addon-fit.js"></script>
    <script src="/static/terminal-popout.js"></script>
  </body>
